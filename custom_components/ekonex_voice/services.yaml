announce:
  name: Annuncio Alexa
  description: Pronuncia un testo semplice sugli Echo Alexa Devices autorizzati in e-Voice.
  fields:
    targets:
      name: Destinatari
      description: Entità Alexa Devices Speak oppure Announce già esposte a e-Voice.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            domain: notify
    message:
      name: Messaggio
      description: Testo semplice da pronunciare, massimo 500 caratteri.
      required: true
      selector:
        text:
          multiline: true
    mode:
      name: Modalità
      required: true
      default: announce
      selector:
        select:
          options:
            - label: Annuncio con suono
              value: announce
            - label: Parla senza suono
              value: speak

run_voice_routine:
  name: Esegui routine vocale
  description: Esegue una routine Alexa configurata nel portale e-Voice. I template Home Assistant vengono risolti prima dell'invio.
  fields:
    routine:
      name: Routine
      description: Slug mostrato nel portale Routine vocali.
      required: true
      selector:
        text:
    message:
      name: Messaggio
      description: Messaggio facoltativo; se presente sostituisce quello predefinito della routine.
      required: false
      selector:
        template:
    installation_id:
      name: ID impianto
      description: Necessario soltanto quando sono configurati più impianti e-Voice nello stesso Home Assistant.
      required: false
      selector:
        text:
