name: Apply Alexa device type implementation v3

on:
  push:
    branches: [agent/alexa-device-type-override]
    paths:
      - .github/workflows/apply-alexa-device-type-patch-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alexa-device-type-override
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply source edits
        run: python scripts/agent_apply_device_type.py
      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/agent_apply_device_type.py
          rm -f .github/workflows/apply-alexa-device-type-patch.yml
          rm -f .github/workflows/apply-alexa-device-type-patch-v2.yml
          rm -f .github/workflows/apply-alexa-device-type-patch-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add per-entity Alexa device type override"
          git push origin HEAD:agent/alexa-device-type-override
