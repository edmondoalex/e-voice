name: Publish HACS release asset

on:
  push:
    branches: [main]
    paths:
      - custom_components/ekonex_voice/manifest.json
      - .github/workflows/release.yml
  release:
    types: [published]

permissions:
  contents: write

jobs:
  hacs-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="$(python -c 'import json; print(json.load(open("custom_components/ekonex_voice/manifest.json", encoding="utf-8"))["version"])')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(python -c 'import json; print(json.load(open("custom_components/ekonex_voice/manifest.json", encoding="utf-8"))["version"])')"
          test "$actual" = "$expected"
      - name: Create prerelease when missing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Ekonex Voice $RELEASE_TAG" \
              --notes "Automated HACS prerelease for Ekonex Voice $RELEASE_TAG." \
              --prerelease
          fi
      - name: Build and inspect HACS archive
        run: |
          python scripts/build_hacs_release.py ekonex_voice.zip
          python - <<'PY'
          import json
          from zipfile import ZipFile

          with ZipFile("ekonex_voice.zip") as archive:
              names = set(archive.namelist())
              assert "manifest.json" in names
              assert "evcp.py" in names
              assert not any(name.startswith("custom_components/") for name in names)
              manifest = json.loads(archive.read("manifest.json"))
              assert manifest["version"]
          PY
      - name: Attach archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" ekonex_voice.zip --clobber
