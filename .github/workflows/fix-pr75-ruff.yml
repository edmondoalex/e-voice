name: Fix PR75 Ruff issues

on:
  push:
    branches: [agent/alexa-device-type-override]
    paths:
      - .github/workflows/fix-pr75-ruff.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alexa-device-type-override
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fix Ruff issues
        run: |
          python -m pip install ruff
          ruff check --fix apps/cloud_api/app/admin_console.py apps/cloud_api/tests/test_alexa_device_types.py
          ruff format apps/cloud_api/app/admin_console.py apps/cloud_api/tests/test_alexa_device_types.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-pr75-ruff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy Ruff checks for Alexa device types"
          git push origin HEAD:agent/alexa-device-type-override
