name: Format PR75 once

on:
  push:
    branches: [agent/alexa-device-type-override]
    paths:
      - .github/workflows/format-pr75-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alexa-device-type-override
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.4
      - name: Format affected files
        run: |
          ruff format apps/cloud_api/app/admin_console.py apps/cloud_api/app/alexa.py apps/cloud_api/app/alexa_device_types.py apps/cloud_api/tests/test_alexa_device_types.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-pr75-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Alexa device type override"
          git push origin HEAD:agent/alexa-device-type-override
