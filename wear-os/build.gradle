plugins { id 'com.android.application' version '8.7.3'; id 'com.google.gms.google-services' version '4.6.0' }
android {
 namespace 'it.ekonex.voice.watch'; compileSdk 35
 defaultConfig { applicationId 'it.ekonex.voice.watch'; minSdk 30; targetSdk 35; versionCode 17; versionName '0.1.16'; buildConfigField 'String','EKONEX_API_BASE','"https://voice.e-control.tech/api/wear/v1"' }
 buildFeatures { buildConfig true }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs=['src']; res.srcDirs=['res'] } }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation platform('com.google.firebase:firebase-bom:35.2.0'); implementation 'com.google.firebase:firebase-messaging' }
